<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VHM Hive Planner — Virtus Humilis</title>
  <link rel="icon" type="image/png" href="VHM-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --vhm-logo: url('VHM-logo.png');
      --bg-obsidian: #070709;
      --panel-bg: rgba(16, 16, 21, 0.88);
      --panel-inner: rgba(10, 10, 14, 0.9);
      --gold: #d4af37;
      --gold-bright: #f3d27a;
      --gold-dim: rgba(212, 175, 55, 0.28);
      --border: rgba(212, 175, 55, 0.25);
      --text: #f3efe6;
      --muted: #a39b8b;
      --cell: 28px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      min-height: 100vh;
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-obsidian);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: var(--vhm-logo);
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: contrast(1.08) brightness(0.4);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, rgba(10, 10, 14, 0.45) 0%, rgba(5, 5, 7, 0.93) 85%);
      pointer-events: none;
    }

    #vhm-planner-app {
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header */
    .vhm-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(135deg, rgba(22, 20, 26, 0.94), rgba(10, 10, 14, 0.95));
      border: 1px solid var(--gold-dim);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(243, 210, 122, 0.15);
      backdrop-filter: blur(10px);
    }

    .brand-box { display: flex; align-items: center; gap: 12px; }

    .brand-crest {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background-color: #0b0b0f;
      object-fit: cover;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.35);
      flex-shrink: 0;
      display: block;
    }

    .brand-title h1 {
      margin: 0;
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
      letter-spacing: 0.08em;
      background: linear-gradient(180deg, #fff5d6 0%, #d4af37 55%, #9c7422 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-title p {
      margin: 2px 0 0;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    button {
      background: rgba(28, 28, 36, 0.94);
      color: var(--text);
      border: 1px solid rgba(212, 175, 55, 0.32);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover {
      background: rgba(45, 42, 54, 0.96);
      border-color: var(--gold);
    }

    button.gold-btn {
      background: linear-gradient(180deg, #d4af37, #9e781f);
      color: #110e07;
      border-color: #f3d27a;
      font-weight: 700;
    }
    button.gold-btn:hover { background: linear-gradient(180deg, #e5c352, #b58c28); }

    button.danger-btn {
      background: rgba(127, 29, 29, 0.88);
      border-color: rgba(248, 113, 113, 0.45);
      color: #fee2e2;
    }
    button.danger-btn:hover { background: rgba(185, 28, 28, 0.96); }

    input[type="number"], input[type="text"], select {
      background: var(--panel-inner);
      color: var(--text);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 0.85rem;
      outline: none;
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus {
      border-color: var(--gold);
    }
    input[type="number"] { width: 60px; }

    /* Tabs */
    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
    }

    .tab-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 2px;
      backdrop-filter: blur(8px);
    }
    .tab-btn .tab-name {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.86rem;
      color: var(--text);
    }
    .tab-btn small { color: var(--muted); font-weight: 500; font-size: 0.72rem; }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(22, 20, 26, 0.96));
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.2);
    }
    .tab-btn.active .tab-name { color: var(--gold-bright); }
    .tab-btn.bf-tab.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(22, 20, 26, 0.96));
      border-color: #c084fc;
    }
    .tab-btn.bf-tab.active .tab-name { color: #e9d5ff; }

    /* Workspace */
    .workspace {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .sidebar {
      width: 305px;
      flex-shrink: 0;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
    }

    .section-title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.16);
      padding-bottom: 4px;
      text-transform: uppercase;
    }

    .tool-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .tool-btn {
      text-align: left;
      padding: 9px 10px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--panel-inner);
    }
    .tool-btn small { color: var(--muted); font-weight: 400; font-size: 0.69rem; }
    .tool-btn.active {
      border-color: var(--gold-bright);
      background: rgba(212, 175, 55, 0.18);
      box-shadow: inset 0 0 0 1px var(--gold);
    }
    .tool-btn.pan-btn { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }

    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .field label { font-size: 0.77rem; color: var(--muted); }

    .inspector-box {
      background: var(--panel-inner);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px;
    }

    .status-msg { font-size: 0.8rem; color: var(--gold-bright); min-height: 18px; font-weight: 500; }

    /* Board Panel */
    .board-panel {
      flex: 1;
      min-width: 0;
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .board-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.16);
    }
    .toolbar-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .dim-label { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }

    .zoom-controls {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--panel-inner);
      border: 1px solid rgba(212, 175, 55, 0.22);
      border-radius: 7px;
      padding: 3px 6px;
    }
    .zoom-controls button { padding: 4px 9px; font-size: 0.8rem; }
    .zoom-controls input[type="range"] { width: 90px; }

    /* Scrollable Grid Viewport */
    .board-scroll {
      overflow: auto;
      max-height: 70vh;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 8px;
      background: rgba(8, 9, 13, 0.96);
      position: relative;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }

    .board-scroll.pan-mode {
      cursor: grab;
      touch-action: none;
    }
    .board-scroll.pan-mode.panning { cursor: grabbing; }

    .grid-frame {
      display: inline-grid;
      grid-template-columns: 28px auto;
      grid-template-rows: 22px auto;
      user-select: none;
    }
    .axis-corner {
      grid-column: 1;
      grid-row: 1;
      position: sticky;
      top: 0;
      left: 0;
      z-index: 9;
      background: #0e0f14;
      border-right: 1px solid rgba(212, 175, 55, 0.25);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }
    .axis-x {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      position: sticky;
      top: 0;
      z-index: 8;
      background: #0e0f14;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }
    .axis-y {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      position: sticky;
      left: 0;
      z-index: 8;
      background: #0e0f14;
      border-right: 1px solid rgba(212, 175, 55, 0.25);
    }
    .axis-cell {
      width: var(--cell);
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.66rem;
      color: rgba(212, 175, 55, 0.8);
      font-family: monospace;
      flex-shrink: 0;
    }
    .axis-y .axis-cell { width: 28px; height: var(--cell); }

    .grid-canvas {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      background-color: rgba(8, 9, 13, 0.92);
      background-image:
        linear-gradient(to right, rgba(212, 175, 55, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(212, 175, 55, 0.15) 1px, transparent 1px);
      background-size: var(--cell) var(--cell);
      touch-action: pan-x pan-y;
    }
    .board-scroll.pan-mode .grid-canvas {
      touch-action: none;
    }

    /* Placed Buildings */
    .building {
      position: absolute;
      border-radius: 5px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2px;
      cursor: grab;
      overflow: hidden;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      z-index: 2;
      touch-action: none;
    }
    .board-scroll.pan-mode .building { cursor: grab; }
    .building:active { cursor: grabbing; }
    .building.locked { cursor: pointer; touch-action: pan-x pan-y; }
    .building.selected { box-shadow: 0 0 0 3px #fde047, 0 0 14px rgba(250, 204, 21, 0.65); z-index: 5; }
    .building .b-name {
      font-size: clamp(8px, calc(var(--cell) * 0.34), 13px);
      line-height: 1.1;
      word-break: break-word;
      max-width: 100%;
    }
    .building .b-meta {
      font-size: clamp(7px, calc(var(--cell) * 0.24), 10px);
      opacity: 0.92;
      font-weight: 500;
    }

    .type-castle {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.94), rgba(138, 92, 18, 0.96));
      border-color: #fef08a;
      color: #161005;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .type-keep.rank-R5 { background: rgba(185, 28, 28, 0.88); border-color: #fca5a5; }
    .type-keep.rank-R4 { background: rgba(194, 102, 12, 0.88); border-color: #fcd34d; }
    .type-keep.rank-Member { background: rgba(29, 78, 216, 0.86); border-color: #93c5fd; }
    .type-keep.rank-Farm { background: rgba(21, 128, 61, 0.86); border-color: #86efac; }
    .type-warehouse { background: rgba(126, 34, 206, 0.9); border-color: #e9d5ff; }
    .type-mine { background: rgba(15, 118, 110, 0.9); border-color: #5eead4; }
    .type-terrain {
      background: repeating-linear-gradient(45deg, #27272a, #27272a 5px, #18181b 5px, #18181b 10px);
      border-color: #71717a;
    }

    .ghost {
      position: absolute;
      pointer-events: none;
      border-radius: 5px;
      border: 2px dashed #4ade80;
      background: rgba(74, 222, 128, 0.25);
      z-index: 10;
      display: none;
    }
    .ghost.invalid { border-color: #f87171; background: rgba(248, 113, 113, 0.32); }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.79rem;
      color: var(--muted);
      padding-top: 6px;
      border-top: 1px solid rgba(212, 175, 55, 0.16);
    }
    .stats-group { display: flex; flex-wrap: wrap; gap: 12px; }
    .stats-group strong { color: var(--gold-bright); }

    .roster-strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .roster-chip {
      font-size: 0.74rem;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(18, 18, 24, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.28);
      color: var(--text);
    }
    .roster-chip:hover, .roster-chip.active {
      border-color: var(--gold-bright);
      background: rgba(212, 175, 55, 0.22);
    }

    @media (max-width: 920px) {
      body { padding: 10px; }
      .workspace { flex-direction: column; }
      .board-panel { order: 1; }
      .sidebar { order: 2; width: 100%; }
      .board-scroll { max-height: 58vh; }
    }
  </style>
</head>
