<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royals Standard March Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --vhm-logo: url('VHM-logo.png');
            --bg-obsidian: #070709;
            --panel-bg: rgba(16, 16, 21, 0.88);
            --panel-inner: rgba(10, 10, 14, 0.9);
            --gold: #d4af37;
            --gold-bright: #f3d27a;
            --gold-dim: rgba(212, 175, 55, 0.28);
            --border: rgba(212, 175, 55, 0.25);
            --text: #f3efe6;
            --muted: #a39b8b;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            min-height: 100%;
            background-color: var(--bg-obsidian);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            top: 0px !important;
            position: relative;
        }

        /* Matching Background Watermark & Vignette */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: var(--vhm-logo);
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: contrast(1.08) brightness(0.4);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, rgba(10, 10, 14, 0.45) 0%, rgba(5, 5, 7, 0.93) 85%);
            pointer-events: none;
        }

        .app-bg {
            background: transparent;
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px 16px;
            min-height: 100vh;
            max-width: 960px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
        }

        .header-card {
            text-align: center;
            background: linear-gradient(135deg, rgba(22, 20, 26, 0.95), rgba(10, 10, 14, 0.97));
            border: 1px solid var(--gold-dim);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(243, 210, 122, 0.15);
            padding: 18px 16px;
        }

        .title {
            font-family: 'Cinzel', Georgia, serif;
            font-size: clamp(1.15rem, 3vw, 1.55rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff5d6 0%, #d4af37 55%, #9c7422 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.25;
        }

        .subtitle {
            font-family: 'Cinzel', Georgia, serif;
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-top: 6px;
            font-weight: 600;
        }

        .translate-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            width: 100%;
            text-align: center;
        }

        #google_translate_element {
            display: inline-block;
            min-width: 220px;
        }

        #google_translate_element select {
            background-color: var(--panel-inner) !important;
            color: var(--gold-bright) !important;
            border: 1px solid var(--border) !important;
            border-radius: 8px !important;
            padding: 10px 14px !important;
            font-family: 'Inter', system-ui, sans-serif !important;
            font-size: 13px !important;
            outline: none !important;
            font-weight: 600 !important;
            width: 100%;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        #google_translate_element select:hover,
        #google_translate_element select:focus {
            border-color: var(--gold) !important;
        }

        .goog-te-gadget { color: transparent !important; font-size: 0px !important; }
        .goog-te-gadget span, .goog-te-banner-frame, #goog-gt-tt, .goog-logo-link { display: none !important; }

        .input-label {
            display: block;
            font-family: 'Cinzel', Georgia, serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .input-field {
            width: 100%;
            box-sizing: border-box;
            background-color: var(--panel-inner);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .input-field:focus {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.22);
        }

        .march-highlight {
            font-size: 16px;
            font-weight: 700;
            color: var(--gold-bright);
        }

        .toggle-btn {
            width: 100%;
            background: var(--panel-inner);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            font-family: 'Cinzel', Georgia, serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .toggle-btn:hover {
            background: rgba(45, 42, 54, 0.96);
            border-color: var(--gold);
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(22, 20, 26, 0.96));
            border-color: var(--gold);
            color: var(--gold-bright);
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.22);
        }

        .table-container {
            overflow-x: auto;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
        }

        .table-header {
            padding: 12px 14px;
            background: linear-gradient(135deg, rgba(22, 20, 26, 0.95), rgba(10, 10, 14, 0.97));
            border-bottom: 1px solid var(--gold-dim);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .table-title {
            font-family: 'Cinzel', Georgia, serif;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .ratio-badge {
            color: var(--gold-bright);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            text-align: left;
        }

        th {
            background-color: var(--panel-inner);
            color: var(--muted);
            padding: 11px 10px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            font-family: 'Cinzel', Georgia, serif;
            font-size: 10px;
            letter-spacing: 0.06em;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.09);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .row-fight {
            background-color: rgba(212, 175, 55, 0.12);
            color: var(--text);
            font-weight: 700;
        }

        .row-layer {
            color: var(--muted);
        }

        .text-right {
            text-align: right;
        }

        .tc-tier {
            color: var(--muted);
            font-weight: 700;
        }

        .row-fight .tc-tier {
            color: var(--gold-bright);
        }

        .tc-ranged { color: #7dd3fc; }
        .tc-mounted { color: #f3d27a; }
        .tc-ground { color: #6ee7b7; }
        .tc-siege { color: #d8b4fe; }
    </style>
</head>
<body>
<div class="app-bg">
    <div class="translate-box"><div id="google_translate_element"></div></div>
    <header class="card header-card">
        <h1 class="title">Royals standard march calculator</h1>
        <div class="subtitle">CONCENTRATED ATTACK PROFILE ENGINE</div>
    </header>
    <div class="card">
        <div style="margin-bottom: 14px;">
            <label class="input-label">Matrix Setup</label>
            <div class="grid-2">
                <button onclick="setMatrix(3)" id="m3" class="toggle-btn active">3-Tier Matrix</button>
                <button onclick="setMatrix(4)" id="m4" class="toggle-btn">4-Tier Matrix</button>
            </div>
        </div>
        <div style="margin-bottom: 14px;">
            <label class="input-label">Core Attack Typemask</label>
            <div class="grid-3">
                <button onclick="setBias('RANGED')" id="bR" class="toggle-btn active">Ranged</button>
                <button onclick="setBias('GROUND')" id="bG" class="toggle-btn">Ground</button>
                <button onclick="setBias('MOUNTED')" id="bM" class="toggle-btn">Mounted</button>
            </div>
        </div>
        <div style="margin-bottom: 6px;">
            <label class="input-label">Total March Size</label>
            <input type="number" id="marchSize" value="6000000" oninput="runCalc()" class="input-field march-highlight">
        </div>
        <div class="grid-2" style="margin-top: 12px; margin-bottom: 0;">
            <div>
                <label class="input-label">Top Tier</label>
                <input type="number" id="topTier" value="17" min="5" max="25" oninput="runCalc()" class="input-field">
            </div>
            <div>
                <label class="input-label">Layer Size</label>
                <input type="number" id="layerSize" value="10000" oninput="runCalc()" class="input-field">
            </div>
        </div>
    </div>
    <div class="table-container">
        <div class="table-header">
            <span class="table-title">CALCULATED DEPLOYMENT ARCHITECTURE</span>
            <span id="ratioInfo" class="ratio-badge">20% / 30% / 50%</span>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th style="padding-left: 12px;">Tier</th>
                        <th class="text-right tc-ranged">Ranged</th>
                        <th class="text-right tc-mounted">Mount</th>
                        <th class="text-right tc-ground">Ground</th>
                        <th class="text-right tc-siege">Siege</th>
                    </tr>
                </thead>
                <tbody id="matrixDisplay"></tbody>
            </table>
        </div>
    </div>
</div>
<script>
const db = {
    3: { RANGED: [0.20, 0.30, 0.50], GROUND: [0.50, 0.30, 0.20], MOUNTED: [0.35, 0.45, 0.20] },
    4: { RANGED: [0.10, 0.20, 0.30, 0.40], GROUND: [0.40, 0.30, 0.20, 0.10], MOUNTED: [0.25, 0.45, 0.20, 0.10] }
};
let layers = 3, bias = 'RANGED';
function setMatrix(n) {
    layers = n;
    document.getElementById('m3').className = (n === 3) ? "toggle-btn active" : "toggle-btn";
    document.getElementById('m4').className = (n === 4) ? "toggle-btn active" : "toggle-btn";
    runCalc();
}
function setBias(b) {
    bias = b;
    document.getElementById('bR').className = (b === 'RANGED') ? "toggle-btn active" : "toggle-btn";
    document.getElementById('bG').className = (b === 'GROUND') ? "toggle-btn active" : "toggle-btn";
    document.getElementById('bM').className = (b === 'MOUNTED') ? "toggle-btn active" : "toggle-btn";
    runCalc();
}
function fmt(n) { return Math.round(n).toLocaleString('en-GB'); }
function runCalc() {
    const ms = parseFloat(document.getElementById('marchSize').value) || 0;
    const tt = parseInt(document.getElementById('topTier').value) || 17;
    const ls = parseFloat(document.getElementById('layerSize').value) || 0;
    const activeWeights = db[layers][bias];
    document.getElementById('ratioInfo').innerText = activeWeights.map(w => (w * 100) + '%').join(' / ');
    let html = '';
    const fightTiers = [];
    for (let i = 0; i < layers; i++) { if (tt - i > 0) fightTiers.push(tt - i); }
    let totalLayersCount = 0;
    for (let t = 1; t <= tt; t++) { if (!fightTiers.includes(t)) totalLayersCount += 4; }
    const remainingMarchSpace = Math.max(0, ms - (totalLayersCount * ls));
    for (let t = tt; t >= 1; t--) {
        let isFight = fightTiers.includes(t), rowClass = isFight ? 'row-fight' : 'row-layer';
        let rVal = ls, mVal = ls, gVal = ls, sVal = ls;
        if (isFight) {
            const w = activeWeights[fightTiers.indexOf(t)];
            if (bias === 'RANGED') rVal = remainingMarchSpace * w;
            else if (bias === 'GROUND') gVal = remainingMarchSpace * w;
            else if (bias === 'MOUNTED') mVal = remainingMarchSpace * w;
        }
        html += `<tr class="${rowClass}"><td style="padding-left:12px;" class="tc-tier">T${t}</td><td class="text-right">${fmt(rVal)}</td><td class="text-right">${fmt(mVal)}</td><td class="text-right">${fmt(gVal)}</td><td class="text-right">${fmt(sVal)}</td></tr>`;
    }
    document.getElementById('matrixDisplay').innerHTML = html;
}
window.onload = function() { runCalc(); };
</script>
</body>
</html>
